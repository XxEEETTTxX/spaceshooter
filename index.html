<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Shooter</title>
<style>
  :root{
    --bg-deep:#0a0e1a;
    --bg-mid:#131a2b;
    --lemon:#f4d738;
    --lemon-dark:#c9a916;
    --leaf:#4caf50;
    --ship:#7dd3e8;
    --danger:#ff5d5d;
    --ui-text:#e8ecf5;
  }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg-deep);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    color:var(--ui-text);
    user-select:none;
  }
  #wrap{ position:relative; width:100%; height:100vh; }
  canvas{ display:block; background:radial-gradient(ellipse at 50% 20%, var(--bg-mid), var(--bg-deep) 70%); cursor:crosshair; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 20px; pointer-events:none;
  }
  .hud-block{
    background:rgba(10,14,26,0.55);
    border:1px solid rgba(244,215,56,0.25);
    border-radius:10px;
    padding:8px 14px;
    backdrop-filter: blur(3px);
  }
  #score{ font-size:20px; font-weight:700; letter-spacing:0.5px; }
  #score span{ color:var(--lemon); }
  #wave{ font-size:13px; opacity:0.8; margin-top:2px; }

  #healthbar-outer{
    width:160px; height:14px; background:rgba(255,255,255,0.08);
    border-radius:7px; overflow:hidden; border:1px solid rgba(255,255,255,0.15);
    margin-top:6px;
  }
  #healthbar-inner{
    height:100%; width:100%;
    background:linear-gradient(90deg,#4caf50,#8bc34a);
    transition: width 0.15s ease;
  }
  #superbar-outer{
    width:160px; height:8px; background:rgba(255,255,255,0.08);
    border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,0.15);
    margin-top:6px;
  }
  #superbar-inner{
    height:100%; width:0%;
    background:linear-gradient(90deg,#4fc3f7,#29b6f6);
    transition: width 0.1s linear;
  }
  .label{ font-size:11px; opacity:0.7; margin-top:6px; }

  #center-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none;
  }
  #center-msg h1{
    font-size:48px; margin:0; color:var(--lemon);
    text-shadow: 0 0 18px rgba(244,215,56,0.6), 0 4px 0 var(--lemon-dark);
    letter-spacing:2px;
  }
  #center-msg p{ font-size:16px; opacity:0.85; margin:10px 0 0; }
  #center-msg .small{ font-size:13px; opacity:0.6; margin-top:18px; }
  #start-btn{
    pointer-events:auto;
    margin-top:22px;
    padding:12px 34px;
    font-size:17px;
    font-weight:700;
    border:none;
    border-radius:30px;
    background:linear-gradient(180deg,#f4d738,#c9a916);
    color:#1a1500;
    cursor:pointer;
    box-shadow:0 4px 0 #8a7200, 0 0 20px rgba(244,215,56,0.4);
  }
  #start-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a7200; }

  #gameover-stats{ margin-top:14px; font-size:15px; color:#cfd6e8; }
  #combo-toast{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    font-size:14px; color:var(--lemon); opacity:0; pointer-events:none;
    text-shadow:0 0 8px rgba(244,215,56,0.7);
  }
  #hint{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:12px; opacity:0.55; pointer-events:none;
    text-align:center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-block">
      <div id="score">SCORE <span id="score-val">0</span></div>
      <div id="wave">Wave 1</div>
    </div>
    <div class="hud-block" style="text-align:right;">
      <div class="label">HULL</div>
      <div id="healthbar-outer"><div id="healthbar-inner"></div></div>
      <div class="label">SUPER (SPACE)</div>
      <div id="superbar-outer"><div id="superbar-inner"></div></div>
    </div>
  </div>

  <div id="combo-toast"></div>
  <div id="hint">WASD / Arrows to move &nbsp;•&nbsp; Mouse to aim &amp; click (or hold) to shoot &nbsp;•&nbsp; SPACE for Super Squeeze</div>

  <div id="center-msg">
    <h1>☄️ SPACE SHOOTER</h1>
    <p>Blast the incoming asteroid field before it grinds your ship to dust.</p>
    <button id="start-btn">Start Game</button>
    <div id="gameover-stats"></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (typeof initNebulae === 'function' && nebulaeReady) initNebulae();
  }
  let nebulaeReady = false;
  resize();
  window.addEventListener('resize', resize);

  const scoreEl = document.getElementById('score-val');
  const waveEl = document.getElementById('wave');
  const healthInner = document.getElementById('healthbar-inner');
  const superInner = document.getElementById('superbar-inner');
  const centerMsg = document.getElementById('center-msg');
  const startBtn = document.getElementById('start-btn');
  const gameoverStats = document.getElementById('gameover-stats');
  const comboToast = document.getElementById('combo-toast');

  // ---------- Input ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      tryUseSuper();
    }
  });
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  const mouse = { x: window.innerWidth/2, y: window.innerHeight/2, down:false };
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });
  canvas.addEventListener('mousedown', () => mouse.down = true);
  window.addEventListener('mouseup', () => mouse.down = false);
  canvas.addEventListener('touchmove', e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top;
    mouse.down = true;
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', () => mouse.down = false);

  // ---------- Game state ----------
  let running = false;
  let score = 0;
  let wave = 1;
  let lastTime = 0;
  let spawnTimer = 0;
  let spawnInterval = 850;
  let waveEnemiesLeft = 10;
  let superCharge = 0;
  const SUPER_MAX = 100;

  const player = {
    x: 0, y: 0, r: 20,
    speed: 320,
    health: 70,
    maxHealth: 70,
    fireCooldown: 0,
    fireRate: 190, // ms
  };

  let bullets = [];
  let enemies = [];
  let particles = [];
  let powerups = [];
  let stars = [];

  let nebulae = [];
  function initNebulae(){
    nebulaeReady = true;
    nebulae = [
      { x: canvas.width*0.2, y: canvas.height*0.15, r: 280, color:'rgba(90,60,160,0.10)' },
      { x: canvas.width*0.8, y: canvas.height*0.35, r: 320, color:'rgba(30,100,150,0.10)' },
      { x: canvas.width*0.5, y: canvas.height*0.8, r: 260, color:'rgba(140,50,90,0.08)' },
    ];
  }

  function initStars(){
    stars = [];
    for (let i=0;i<140;i++){
      stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.6+0.3,
        speed: Math.random()*20+6,
        tw: Math.random()*Math.PI*2
      });
    }
  }

  function resetGame(){
    score = 0; wave = 1; waveEnemiesLeft = 6; spawnInterval = 1400;
    player.x = canvas.width/2; player.y = canvas.height*0.75;
    player.health = player.maxHealth; player.fireCooldown = 0;
    bullets = []; enemies = []; particles = []; powerups = [];
    superCharge = 0;
    updateHUD();
    initStars();
    initNebulae();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    waveEl.textContent = 'Wave ' + wave;
    healthInner.style.width = Math.max(0, (player.health/player.maxHealth)*100) + '%';
    if (player.health < 30) healthInner.style.background = 'linear-gradient(90deg,#e53935,#ff7043)';
    else if (player.health < 60) healthInner.style.background = 'linear-gradient(90deg,#fbc02d,#ffca28)';
    else healthInner.style.background = 'linear-gradient(90deg,#4caf50,#8bc34a)';
    superInner.style.width = superCharge + '%';
  }

  // ---------- Entities ----------
  function spawnEnemy(){
    const edge = Math.floor(Math.random()*3); // 0 top,1 left,2 right
    let x,y;
    if (edge===0){ x = Math.random()*canvas.width; y = -30; }
    else if (edge===1){ x = -30; y = Math.random()*canvas.height*0.5; }
    else { x = canvas.width+30; y = Math.random()*canvas.height*0.5; }

    const roll = Math.random();
    let type = 'normal';
    if (wave >= 2 && roll < 0.28) type = 'spiky';
    else if (wave >= 1 && roll < 0.55) type = 'zesty'; // fast

    const base = {
      normal: { r:24, hp:3, speed:75, color:'#9a958c', dark:'#5c584f', score:10 },
      spiky:  { r:28, hp:6, speed:58, color:'#c1512a', dark:'#5a2410', score:25 },
      zesty:  { r:17, hp:2, speed:150, color:'#bfe6f2', dark:'#5f8a94', score:15 },
    }[type];

    // Generate a jagged, irregular rock silhouette once per asteroid
    const segs = 10 + Math.floor(Math.random()*4);
    const points = [];
    for (let i=0;i<segs;i++){
      points.push(0.72 + Math.random()*0.5);
    }
    const craters = [];
    const craterCount = 2 + Math.floor(Math.random()*3);
    for (let i=0;i<craterCount;i++){
      const ang = Math.random()*Math.PI*2;
      const dist = Math.random()*0.5;
      craters.push({ ang, dist, r: 0.12 + Math.random()*0.16 });
    }

    enemies.push({
      x, y, r: base.r, hp: base.hp, maxHp: base.hp,
      speed: base.speed * (1 + wave*0.07),
      color: base.color, dark: base.dark, type, scoreVal: base.score,
      wobble: Math.random()*Math.PI*2,
      spin: (Math.random()-0.5) * 1.6,
      rot: Math.random()*Math.PI*2,
      points, craters,
    });
  }

  function spawnPowerup(x,y){
    if (Math.random() < 0.08){
      const kind = Math.random() < 0.5 ? 'heal' : 'rapid';
      powerups.push({x,y,kind, r:12, t:0});
    }
  }

  function shoot(){
    if (player.fireCooldown > 0) return;
    player.fireCooldown = player.fireRate;
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const dist = Math.hypot(dx,dy) || 1;
    const speed = 620;
    bullets.push({
      x: player.x + (dx/dist)*player.r,
      y: player.y + (dy/dist)*player.r,
      vx: (dx/dist)*speed, vy: (dy/dist)*speed,
      r: 5, life: 1200
    });
  }

  let rapidUntil = 0;
  function tryUseSuper(){
    if (!running) return;
    if (superCharge >= SUPER_MAX){
      superCharge = 0;
      // Super Squeeze: damage + clear nearby, radial burst
      for (const en of enemies){
        en.hp -= 5;
        const dx = en.x-player.x, dy = en.y-player.y;
        const d = Math.hypot(dx,dy)||1;
        en.x += (dx/d)*40; en.y += (dy/d)*40;
      }
      for (let i=0;i<40;i++){
        const ang = Math.random()*Math.PI*2;
        particles.push({
          x:player.x, y:player.y,
          vx:Math.cos(ang)*300, vy:Math.sin(ang)*300,
          life: 500, color:'#4fc3f7', r: Math.random()*4+2
        });
      }
      updateHUD();
    }
  }

  function damagePlayer(amount){
    player.health -= amount;
    for (let i=0;i<10;i++){
      const ang = Math.random()*Math.PI*2;
      particles.push({ x:player.x, y:player.y, vx:Math.cos(ang)*150, vy:Math.sin(ang)*150, life:300, color:'#ff5d5d', r:3 });
    }
    if (player.health <= 0){
      player.health = 0;
      endGame();
    }
    updateHUD();
  }

  function killEnemy(en, idx){
    score += en.scoreVal;
    superCharge = Math.min(SUPER_MAX, superCharge + 6);
    for (let i=0;i<14;i++){
      const ang = Math.random()*Math.PI*2;
      particles.push({
        x:en.x, y:en.y,
        vx:Math.cos(ang)*(Math.random()*160+40),
        vy:Math.sin(ang)*(Math.random()*160+40),
        life: 450, color: Math.random()<0.5 ? en.color : en.dark, r: Math.random()*3+1.5
      });
    }
    spawnPowerup(en.x, en.y);
    enemies.splice(idx,1);
    updateHUD();
  }

  // ---------- Loop ----------
  function endGame(){
    running = false;
    gameoverStats.innerHTML = `Final score: <b style="color:#f4d738">${score}</b> &nbsp;|&nbsp; Reached Wave ${wave}`;
    document.querySelector('#center-msg h1').textContent = '💥 Game Over';
    document.querySelector('#center-msg p').textContent = 'The asteroid field got the better of you this time.';
    startBtn.textContent = 'Try Again';
    centerMsg.style.display = 'block';
  }

  function startGame(){
    resetGame();
    running = true;
    centerMsg.style.display = 'none';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);

  function loop(now){
    if (!running) return;
    const dt = Math.min(50, now - lastTime);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    const dtS = dt/1000;

    // Player movement
    let mvx=0, mvy=0;
    if (keys['w']||keys['arrowup']) mvy -= 1;
    if (keys['s']||keys['arrowdown']) mvy += 1;
    if (keys['a']||keys['arrowleft']) mvx -= 1;
    if (keys['d']||keys['arrowright']) mvx += 1;
    const mlen = Math.hypot(mvx,mvy) || 1;
    if (mvx||mvy){
      player.x += (mvx/mlen)*player.speed*dtS;
      player.y += (mvy/mlen)*player.speed*dtS;
    }
    player.x = Math.max(player.r, Math.min(canvas.width-player.r, player.x));
    player.y = Math.max(player.r, Math.min(canvas.height-player.r, player.y));

    // Firing
    if (player.fireCooldown > 0) player.fireCooldown -= dt;
    if (mouse.down) shoot();

    // Bullets
    for (let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.x += b.vx*dtS; b.y += b.vy*dtS; b.life -= dt;
      if (b.life<=0 || b.x<-20||b.x>canvas.width+20||b.y<-20||b.y>canvas.height+20){
        bullets.splice(i,1);
      }
    }

    // Spawning
    spawnTimer += dt;
    if (spawnTimer > spawnInterval && waveEnemiesLeft > 0){
      spawnTimer = 0;
      spawnEnemy();
      waveEnemiesLeft--;
    }
    if (waveEnemiesLeft <= 0 && enemies.length === 0){
      wave++;
      waveEnemiesLeft = 8 + wave*3;
      spawnInterval = Math.max(220, 850 - wave*70);
      showCombo('Wave ' + wave + ' incoming!');
      updateHUD();
    }

    // Enemies
    for (let i=enemies.length-1;i>=0;i--){
      const en = enemies[i];
      const dx = player.x-en.x, dy = player.y-en.y;
      const d = Math.hypot(dx,dy)||1;
      en.wobble += dtS*4;
      en.rot += en.spin*dtS;
      const wob = Math.sin(en.wobble)*0.3;
      en.x += ((dx/d)+wob*(dy/d))*en.speed*dtS;
      en.y += ((dy/d)-wob*(dx/d))*en.speed*dtS;

      // collide with player
      if (d < en.r + player.r){
        damagePlayer(en.type==='spiky'?32:20);
        enemies.splice(i,1);
        continue;
      }

      // collide with bullets
      for (let j=bullets.length-1;j>=0;j--){
        const b = bullets[j];
        const bd = Math.hypot(b.x-en.x, b.y-en.y);
        if (bd < en.r + b.r){
          en.hp -= 1;
          bullets.splice(j,1);
          if (en.hp<=0){ killEnemy(en, i); }
          break;
        }
      }
    }

    // Powerups
    for (let i=powerups.length-1;i>=0;i--){
      const p = powerups[i];
      p.t += dt;
      const d = Math.hypot(p.x-player.x, p.y-player.y);
      if (d < p.r+player.r){
        if (p.kind==='heal'){ player.health = Math.min(player.maxHealth, player.health+15); showCombo('+15 Hull'); }
        else { rapidUntil = performance.now()+3000; player.fireRate=90; showCombo('Rapid Fire!'); }
        powerups.splice(i,1);
        updateHUD();
      } else if (p.t > 9000){
        powerups.splice(i,1);
      }
    }
    if (rapidUntil && performance.now() > rapidUntil){ player.fireRate = 180; rapidUntil = 0; }

    // Particles
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dtS; p.y += p.vy*dtS;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt;
      if (p.life<=0) particles.splice(i,1);
    }

    // Stars parallax
    for (const s of stars){
      s.y += s.speed*dtS;
      if (s.y > canvas.height) { s.y = -5; s.x = Math.random()*canvas.width; }
    }
  }

  let comboTimeout;
  function showCombo(text){
    comboToast.textContent = text;
    comboToast.style.opacity = 1;
    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(()=>{ comboToast.style.opacity = 0; }, 1400);
  }

  // ---------- Draw ----------
  function drawAsteroid(en){
    const { x, y, r, color, dark, rot, points, craters, type } = en;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);

    // subtle glow for hot (spiky) and icy (zesty) types
    if (type === 'spiky'){
      ctx.shadowColor = 'rgba(255,110,50,0.55)';
      ctx.shadowBlur = 14;
    } else if (type === 'zesty'){
      ctx.shadowColor = 'rgba(150,225,255,0.5)';
      ctx.shadowBlur = 10;
    }

    // jagged rock body
    ctx.beginPath();
    const n = points.length;
    for (let i=0;i<n;i++){
      const ang = (i/n)*Math.PI*2;
      const rad = r * points[i];
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    const grad = ctx.createRadialGradient(-r*0.3,-r*0.3, r*0.1, 0,0, r*1.1);
    grad.addColorStop(0, lighten(color, 30));
    grad.addColorStop(0.6, color);
    grad.addColorStop(1, dark);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // craters
    for (const c of craters){
      const cx = Math.cos(c.ang)*r*c.dist, cy = Math.sin(c.ang)*r*c.dist;
      ctx.beginPath();
      ctx.arc(cx,cy, r*c.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - r*c.r*0.25, cy - r*c.r*0.25, r*c.r*0.4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
    }

    // jagged edge cracks for spiky/lava type
    if (type === 'spiky'){
      ctx.strokeStyle = 'rgba(255,150,60,0.85)';
      ctx.lineWidth = 1.2;
      for (let i=0;i<3;i++){
        const ang = (i/3)*Math.PI*2 + rot*0.3;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(ang)*r*0.7, Math.sin(ang)*r*0.7);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function lighten(hex, amt){
    const c = hex.replace('#','');
    const num = parseInt(c,16);
    let r = (num>>16)+amt, g = ((num>>8)&0xff)+amt, b=(num&0xff)+amt;
    r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
    return `rgb(${r},${g},${b})`;
  }

  function drawShip(x,y,angle){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);

    // engine thruster (layered flame, behind hull)
    const flicker = 0.7 + Math.random()*0.3;
    ctx.save();
    ctx.globalAlpha = flicker;
    const flameGrad = ctx.createLinearGradient(-32,0,-8,0);
    flameGrad.addColorStop(0, 'rgba(79,195,247,0)');
    flameGrad.addColorStop(0.5, 'rgba(79,195,247,0.55)');
    flameGrad.addColorStop(1, 'rgba(200,245,255,0.95)');
    ctx.beginPath();
    ctx.moveTo(-9,5);
    ctx.lineTo(-26-Math.random()*10,0);
    ctx.lineTo(-9,-5);
    ctx.closePath();
    ctx.fillStyle = flameGrad;
    ctx.fill();
    ctx.restore();

    // hull shadow
    ctx.save();
    ctx.translate(1.5,2.5);
    ctx.beginPath();
    ctx.moveTo(24,0);
    ctx.lineTo(-6,9);
    ctx.lineTo(-16,14);
    ctx.lineTo(-10,0);
    ctx.lineTo(-16,-14);
    ctx.lineTo(-6,-9);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.restore();

    // main hull
    ctx.beginPath();
    ctx.moveTo(24,0);
    ctx.lineTo(-6,9);
    ctx.lineTo(-16,14);
    ctx.lineTo(-10,0);
    ctx.lineTo(-16,-14);
    ctx.lineTo(-6,-9);
    ctx.closePath();
    const hullGrad = ctx.createLinearGradient(-16,-14,24,14);
    hullGrad.addColorStop(0, '#3d8fa3');
    hullGrad.addColorStop(0.5, '#7dd3e8');
    hullGrad.addColorStop(1, '#c8f3ff');
    ctx.fillStyle = hullGrad;
    ctx.fill();
    ctx.strokeStyle = '#0f2e35';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // wing accent stripes
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-4,7); ctx.lineTo(-14,12);
    ctx.moveTo(-4,-7); ctx.lineTo(-14,-12);
    ctx.stroke();

    // nose stripe
    ctx.strokeStyle = 'rgba(20,50,60,0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(24,0); ctx.lineTo(2,0);
    ctx.stroke();

    // cockpit canopy
    const cockGrad = ctx.createRadialGradient(3,-1.5,0.5, 5,0,6);
    cockGrad.addColorStop(0, '#ffffff');
    cockGrad.addColorStop(0.5, '#8fe9ff');
    cockGrad.addColorStop(1, '#1d4e59');
    ctx.beginPath();
    ctx.ellipse(5,0, 5.5, 4, 0, 0, Math.PI*2);
    ctx.fillStyle = cockGrad;
    ctx.fill();
    ctx.strokeStyle = '#0f2e35';
    ctx.lineWidth = 1;
    ctx.stroke();

    // wingtip lights
    ctx.beginPath();
    ctx.arc(-15,13,1.6,0,Math.PI*2);
    ctx.fillStyle = '#ff5d5d';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-15,-13,1.6,0,Math.PI*2);
    ctx.fillStyle = '#4fc3f7';
    ctx.fill();

    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // nebula backdrop
    for (const n of nebulae){
      const g = ctx.createRadialGradient(n.x,n.y,0, n.x,n.y,n.r);
      g.addColorStop(0, n.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    // stars
    ctx.fillStyle = '#ffffff';
    for (const s of stars){
      ctx.globalAlpha = 0.4 + Math.sin(s.tw + performance.now()/500)*0.3;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // powerups
    for (const p of powerups){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.beginPath();
      ctx.arc(0,0,p.r+3,0,Math.PI*2);
      ctx.fillStyle = p.kind==='heal' ? 'rgba(76,175,80,0.25)' : 'rgba(79,195,247,0.25)';
      ctx.fill();
      ctx.font = '18px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.kind==='heal' ? '❤' : '⚡', 0, 1);
      ctx.restore();
    }

    // enemies
    for (const en of enemies){
      drawAsteroid(en);
      if (en.hp < en.maxHp){
        ctx.fillStyle='rgba(0,0,0,0.45)';
        ctx.fillRect(en.x-en.r, en.y-en.r-10, en.r*2, 4);
        ctx.fillStyle='#e8fbff';
        ctx.fillRect(en.x-en.r, en.y-en.r-10, en.r*2*(en.hp/en.maxHp), 4);
      }
    }

    // bullets
    ctx.fillStyle = '#bff7ff';
    for (const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fill();
    }

    // particles
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, p.life/450);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player
    const angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);
    drawShip(player.x, player.y, angle);
  }

  // Prep initial state
  resetGame();
  draw();
})();
</script>
</body>
</html>
